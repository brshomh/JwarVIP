name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SECRETS: ${{ secrets.PLAY_STORE_JSON_KEY != '' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign Android Release
        if: ${{ env.HAS_ANDROID_SECRETS == 'true' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: ${{ steps.sign_app.outputs.signedReleaseFile || 'android/app/build/outputs/bundle/release/app-release.aab' }}

      - name: Upload to Google Play
        if: ${{ env.HAS_ANDROID_SECRETS == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.jawr.pro
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal

  build-ios:
    name: Build iOS Archive (.ipa)
    runs-on: macos-latest
    env:
      HAS_IOS_SECRETS: ${{ secrets.IOS_DIST_SIGNING_KEY != '' && secrets.IOS_PROVISIONING_PROFILE != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install cocoapods
        run: |
          cd ios/App
          pod install

      - name: Install Apple Certificate
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_SIGNING_KEY }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_keychain_password' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          # Debug base64 input length
          echo "Base64 string length: ${#BUILD_CERTIFICATE_BASE64}"
          # Decode using printf to avoid trailing newline issues
          printf "%s" "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          # Debug decoded file
          echo "Decoded file details:"
          ls -la $CERTIFICATE_PATH
          file $CERTIFICATE_PATH
          # Check first few bytes (hex)
          od -t x1 -N 10 $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PP_FOLDER=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_FOLDER"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_FOLDER/profile.mobileprovision"

      - name: Build Xcode Archive (Device)
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive

      - name: Build Xcode Archive (Simulator fallback)
        if: ${{ env.HAS_IOS_SECRETS == 'false' }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Release \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive

      - name: Export IPA
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportPath ios/App/build \
                     -exportOptionsPlist ios/App/App/ExportOptions.plist

      - name: Upload iOS IPA Artifact
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ios/App/build/App.ipa

      - name: Setup App Store Connect Private Key
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Upload to App Store Connect
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file ios/App/build/App.ipa \
                       --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                       --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

# Trigger rebuild 2
