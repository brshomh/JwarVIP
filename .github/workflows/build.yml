name: Build Mobile Apps (Android & iOS)

on:
  push:
      branches:
            - main
              workflow_dispatch:

              jobs:
                build-android:
                    name: Build Android App Bundle (.aab)
                        runs-on: ubuntu-latest

                            steps:
                                  - name: Checkout repository
                                          uses: actions/checkout@v4
                                                - name: Set up JDK 17
                                                        uses: actions/setup-java@v4
                                                                with:
                                                                          java-version: '17'
                                                                                    distribution: 'temurin'
                                                                                          - name: Install Node.js
                                                                                                  uses: actions/setup-node@v4
                                                                                                          with:
                                                                                                                    node-version: '18'
                                                                                                                              cache: 'npm'
                                                                                                                              
                                                                                                                                    - name: Install dependencies
                                                                                                                                            run: npm install
                                                                                                                                                  - name: Build Web App
                                                                                                                                                          run: npm run build
                                                                                                                                                                - name: Sync Capacitor
                                                                                                                                                                        run: npx cap sync android
                                                                                                                                                                              - name: Build Android Release
                                                                                                                                                                                      run: cd android && ./gradlew bundleRelease
                                                                                                                                                                                      
                                                                                                                                                                                            - name: Upload Android Artifact
                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                            with:
                                                                                                                                                                                                                      name: android-release-bundle
                                                                                                                                                                                                                                path: android/app/build/outputs/bundle/release/app-release.aab
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                  build-ios:
                                                                                                                                                                                                                                      name: Build iOS Archive (.ipa)
                                                                                                                                                                                                                                          runs-on: macos-latest
                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                              steps:
                                                                                                                                                                                                                                                    - name: Checkout repository
                                                                                                                                                                                                                                                            uses: actions/checkout@v4
                                                                                                                                                                                                                                                                  - name: Install Node.js
                                                                                                                                                                                                                                                                          uses: actions/setup-node@v4
                                                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                                                            node-version: '18'
                                                                                                                                                                                                                                                                                                      cache: 'npm'

                                                                                                        - name: Install dependencies
                                                                                                                run: npm install
                                                                                                                      - name: Build Web App
                                                                                                                              run: npm run build
                                                                                                                              
                                                                                                                                    - name: Sync Capacitor
                                                                                                                                            run: npx cap sync ios
                                                                                                                                                  - name: CocoaPods Install
                                                                                                                                                          run: cd ios/App && pod install
                                                                                                                                                          
                                                                                                                                                                - name: Import App Store Connect Private Key
                                                                                                                                                                        run: mkdir -p ~/.appstoreconnect/private_keys && echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
                                                                                                                                                                        
                                                                                                                                                                              - name: Build Xcode Archive
                                                                                                                                                                                      run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath ios/App/build/App.xcarchive -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} -allowProvisioningUpdates archive
                                                                                                                                                                                      
                                                                                                                                                                                            - name: Export IPA
                                                                                                                                                                                                    run: xcodebuild -exportArchive -archivePath ios/App/build/App.xcarchive -exportPath ios/App/build -exportOptionsPlist ios/App/App/ExportOptions.plist -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} -allowProvisioningUpdates
                                                                                                                                                                                                    
                                                                                                                                                                                                          - name: Upload to App Store Connect
                                                                                                                                                                                                                  run: xcrun altool --upload-app --type ios --file ios/App/build/App.ipa --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                                                                                                                                                                                                                        - name: Upload iOS IPA Artifact
                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                  name: ios-release-ipa
                                                                                                                                                                                                                                                            path: ios/App/build/App.ipa
                                                                                                                                                                                                                                                            
