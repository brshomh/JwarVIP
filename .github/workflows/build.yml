name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SECRETS: ${{ secrets.PLAY_STORE_JSON_KEY != '' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign Android Release
        if: ${{ env.HAS_ANDROID_SECRETS == 'true' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: ${{ steps.sign_app.outputs.signedReleaseFile || 'android/app/build/outputs/bundle/release/app-release.aab' }}

      - name: Upload to Google Play
        if: ${{ env.HAS_ANDROID_SECRETS == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.jawr.pro
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: internal

  build-ios:
    name: Build iOS Archive (.ipa)
    runs-on: macos-latest
    env:
      HAS_IOS_SECRETS: ${{ secrets.IOS_DIST_SIGNING_KEY != '' && secrets.IOS_PROVISIONING_PROFILE != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Update Capacitor config appId
        run: |
          python3 -c "import json; f=open('capacitor.config.json','r'); d=json.load(f); d['appId']='com.jawr.app'; open('capacitor.config.json','w').write(json.dumps(d,indent=2))"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install cocoapods
        run: |
          cd ios/App
          pod install

      - name: Install Apple Certificate
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_SIGNING_KEY }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_keychain_password' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing-${{ github.run_id }}-${{ github.run_attempt }}.keychain

          # delete keychain if it already exists from previous runs/steps
          security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Debug base64 input length and decode cleanly with self-healing padding
          echo "Base64 string length: ${#BUILD_CERTIFICATE_BASE64}"
          # Check for character counts to detect URL-encoding / space replacement issues
          echo "Plus character count: $(printf "%s" "$BUILD_CERTIFICATE_BASE64" | tr -cd '+' | wc -c)"
          echo "Space character count: $(printf "%s" "$BUILD_CERTIFICATE_BASE64" | tr -cd ' ' | wc -c)"
          echo "Slash character count: $(printf "%s" "$BUILD_CERTIFICATE_BASE64" | tr -cd '/' | wc -c)"
          
          # If spaces are found instead of plus, replace them back!
          CONVERTED_CERT=$(echo -n "$BUILD_CERTIFICATE_BASE64" | tr ' ' '+')
          
          PADDED_CERT=$CONVERTED_CERT
          while [ $((${#PADDED_CERT} % 4)) -ne 0 ]; do
            PADDED_CERT="${PADDED_CERT}="
          done
          echo "Padded Base64 string length: ${#PADDED_CERT}"
          printf "%s" "$PADDED_CERT" | base64 --decode > $CERTIFICATE_PATH
          
          # Debug decoded file
          echo "Decoded file details:"
          ls -la $CERTIFICATE_PATH
          file $CERTIFICATE_PATH
          echo "First 10 bytes:"
          od -t x1 -N 10 $CERTIFICATE_PATH
          echo "Last 20 bytes:"
          tail -c 20 $CERTIFICATE_PATH | od -t x1

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PP_FOLDER=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_FOLDER"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_FOLDER/6b987d53-53ba-4fc7-af8b-9663e5b2cbdf.mobileprovision"

      - name: Build Xcode Archive (Device)
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive

      - name: Build Xcode Archive (Simulator fallback)
        if: ${{ env.HAS_IOS_SECRETS == 'false' }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Release \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive

      - name: Export IPA
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          # Write manual signing ExportOptions.plist
          cat <<'EOF' > ios/App/App/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>method</key>
          	<string>app-store</string>
          	<key>signingCertificate</key>
          	<string>Apple Distribution</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>stripSwiftSymbols</key>
          	<true/>
          	<key>teamID</key>
          	<string>ABP3HWFZQR</string>
          	<key>uploadSymbols</key>
          	<true/>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.jawr.app</key>
          		<string>6b987d53-53ba-4fc7-af8b-9663e5b2cbdf</string>
          	</dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportPath ios/App/build \
                     -exportOptionsPlist ios/App/App/ExportOptions.plist

      - name: Upload iOS IPA Artifact
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ios/App/build/App.ipa

      - name: Setup App Store Connect Private Key
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Upload to App Store Connect
        if: ${{ env.HAS_IOS_SECRETS == 'true' }}
        run: |
          xcrun altool --upload-app \
                       --type ios \
                       --file ios/App/build/App.ipa \
                       --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                       --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

